<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zeroa deal calculator</title>
<style>
:root { --teal: #138085; --teal-cta: #1FA6A6; --ink: #232B33; --slate: #5F7D95; --stone: #E7E3DC; --mist: #F4F7F8; --sell: #C65A5A; color-scheme: light; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--mist); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
.card { width: 100%; max-width: 360px; background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(35, 43, 51, .06), 0 2px 8px rgba(35, 43, 51, .05); padding: 28px 24px 22px; box-sizing: border-box; }
.logo { display: block; height: 30px; margin: 0 0 18px; }
h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
p { margin: 0 0 18px; color: var(--slate); }
form[hidden] { display: none; }
label { display: block; font-weight: 600; margin: 0 0 6px; }
input[type=password] { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--stone); border-radius: 8px; background: #fff; color: var(--ink); }
input[type=password]:focus { outline: 2px solid var(--teal-cta); outline-offset: 1px; border-color: var(--teal-cta); }
.rem { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-weight: 400; cursor: pointer; }
.rem input { width: 16px; height: 16px; margin: 0; accent-color: var(--teal); }
button { width: 100%; font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--teal); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 22px; margin: 12px 0 0; color: var(--sell); }
.msg.wait { color: var(--slate); }
.foot { margin: 16px 0 0; font-size: 12px; color: var(--slate); }
</style>
</head>

<script>
// The calculator is encrypted (AES-256-GCM, key from the password by PBKDF2-SHA256).
// A correct password decrypts the page and replaces this lock screen with it. Everything here stays
// inside this function, so the app's own scripts start in a clean window. The form stays hidden until
// this script is ready, so the password can never go out in a normal form submit.
(function () {
  var KEY_NAME = 'zgg.lock.key';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('lock'), pw = $('pw'), rem = $('rem'), btn = $('go'), msg = $('msg'), box = $('payload');
  var saltB64 = box.getAttribute('data-salt'), ivB64 = box.getAttribute('data-iv');
  var iter = parseInt(box.getAttribute('data-iter'), 10);
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function say(text, wait) { msg.textContent = text; msg.className = wait ? 'msg wait' : 'msg'; }
  function busy(on) { pw.disabled = on; rem.disabled = on; btn.disabled = on; }
  function forget() { try { localStorage.removeItem(KEY_NAME); } catch (e) { /* storage blocked */ } }
  // a key saved under another password, or a damaged entry, is removed
  function stored() {
    var v = null;
    try { v = JSON.parse(localStorage.getItem(KEY_NAME) || 'null'); } catch (e) { forget(); return null; }
    if (!v) return null;
    if (v.s !== saltB64 || typeof v.k !== 'string') { forget(); return null; }
    return v.k;
  }
  function keep(k) { try { localStorage.setItem(KEY_NAME, JSON.stringify({ s: saltB64, k: k })); } catch (e) { /* storage blocked */ } }
  function canInflate() { try { new DecompressionStream('deflate-raw'); return true; } catch (e) { return false; } }

  if (window.isSecureContext === false) {
    say('Open this page from its https:// address.');
    return;
  }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined' || !canInflate()) {
    say('This browser is too old to open the calculator. Open the link in a current version of Edge, Chrome, Firefox or Safari. On an iPhone or iPad, update to iOS 16.4 or later.');
    return;
  }
  var salt, iv, data;
  try { salt = bytes(saltB64); iv = bytes(ivB64); data = bytes(box.textContent.trim()); } catch (e) {
    say('This page did not load properly. Reload it.');
    return;
  }

  function keyFrom(password) {
    var norm = password.toLowerCase().replace(/[^a-z0-9]/g, '');
    return crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function page(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data).then(function (buf) {
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  // A browser can keep this page for a few minutes after an update. When a password fails, look for a
  // newer copy on the server, and reload into it if there is one. It reads only as far as the build's
  // IV and gives up after 6 seconds, so a slow connection just gets the wrong-password message.
  function newer() {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
    var end = function (v) { clearTimeout(timer); return v; };
    return fetch(location.href, { cache: 'reload', signal: ctl ? ctl.signal : undefined }).then(function (r) {
      if (!r.ok || !r.body) return false;
      var reader = r.body.getReader(), dec = new TextDecoder(), text = '';
      function step() {
        return reader.read().then(function (c) {
          if (!c.done) text += dec.decode(c.value, { stream: true });
          var m = text.match(/<script id="payload"[^>]* data-iv="([^"]+)"/);
          if (m || c.done) { if (!c.done) reader.cancel().catch(function () {}); return !!m && m[1] !== ivB64; }
          return step();
        });
      }
      return step();
    }).then(end, function () { return end(false); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value.trim()) return;
    busy(true); say('Opening…', true);
    var key;
    keyFrom(pw.value).then(function (k) { key = k; return page(k); }).then(function (html) {
      if (!rem.checked) { forget(); show(html); return; }
      return crypto.subtle.exportKey('raw', key).then(function (raw) { keep(toB64(raw)); }, function () {}).then(function () { show(html); });
    }, function () {
      return newer().then(function (isNewer) {
        if (isNewer) { say('This page has been updated. Type the password again once it reloads.', true); setTimeout(function () { location.reload(); }, 1500); return; }
        busy(false); say('That password is wrong. Try again.');
        pw.focus(); pw.select();
      });
    });
  });
  form.hidden = false;
  btn.disabled = false;

  // A device that was told to remember opens straight away.
  function auto() {
    var k = stored();
    if (!k) { pw.focus(); return; }
    busy(true); say('Opening…', true);
    var fail = function () { forget(); busy(false); say(''); pw.focus(); };
    var raw; try { raw = bytes(k); } catch (e) { fail(); return; }
    crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']).then(page).then(show, fail);
  }
  if (document.readyState === 'complete') auto(); else window.addEventListener('load', auto);
})();
</script>
